<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 52 - Kacper Hebel</title>
</head>
<body>

<script>
    let a_heb = (5 % 4) + 5;
    let b_heb = (5 % 6) + 20;

    for (let k_heb = 1; k_heb <= a_heb; k_heb++) {
        for (let j_heb = 1; j_heb <= b_heb; j_heb++) {
            if (k_heb == 1 || k_heb == a_heb || j_heb == 1 || j_heb == b_heb) {
                document.write("*");
            } else {
                document.write("&nbsp;&nbsp;");
            }
        }
        document.write("<br>");
    }
</script>

</body>
</html>
