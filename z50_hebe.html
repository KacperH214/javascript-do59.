<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 50 - Kacper Hebel</title>
</head>
<body>

<div style="color:red; font-size:2cm;">
<script>
    for (let i_heb = 1; i_heb <= 10; i_heb++) {
        for (let j_heb = 1; j_heb <= i_heb; j_heb++) {
            document.write("&nbsp;");
        }
        document.write(i_heb + "<br>");
    }
</script>
</div>

</body>
</html>
