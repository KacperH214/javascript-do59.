<script>
    let liczba_liter_nazwiska_heb = 5;
    let ile_razy_wyswietlic_heb = (liczba_liter_nazwiska_heb % 5    ) + 10;
    let wielkosc_liter_heb = (liczba_liter_nazwiska_heb % 5) + 40;

    let dana_heb = prompt("Podaj liczbę:");
    dana_heb = parseInt(dana_heb);

    document.write("ilość wykonania pętli = " + ile_razy_wyswietlic_heb + "<br>");
    document.write("wielkość liter = " + wielkosc_liter_heb + "px<br><br>");

    for (let k_h = 1; k_h <= ile_razy_wyswietlic_heb; k_h++) {
        if (dana_heb% 2 == 0) {
            document.write("<span style='color:blue; font-size:" + wielkosc_liter_heb + "px;'>Hebel</span><br>");
        } else {
            document.write("<span style='color:green; font-size:" + wielkosc_liter_heb + "px;'>Kacper</span><br>");
        }
    }
</script>
