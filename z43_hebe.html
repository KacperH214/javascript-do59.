<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 43</title>
</head>
<body>

<div> style="color:red; font-size:40px;">
<script>
    let koniec_petli_heb = prompt("Podaj liczbę końcową:");
    koniec_petli_heb = parseInt(koniec_petli_heb);

    for (let k_h = 2; k_h <= koniec_petli_heb; k_h++) {
        if (k_h % 2 == 0) {
            document.write(k_h + "<br>");
        }
    }
</script>
</div>

</body>
</html>
