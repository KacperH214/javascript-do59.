<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 49 - Kacper Hebel</title>
</head>
<body>

<div style="color:red; font-size:30px;">
<script>
    let n_heb = prompt("Podaj liczbę n:");
    n_heb = parseInt(n_heb);

    let silnia_heb = 1;

    for (let k_heb = 1; k_heb <= n_heb; k_heb++) {
        silnia_heb = silnia_heb * k_heb;
    }

    document.write("n = " + n_heb + "<br>");
    document.write(n_heb + "! = " + silnia_heb);
</script>
</div>

</body>
</html>
