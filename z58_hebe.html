<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 58 - Kacper Hebel</title>
</head>
<body>

<script>
    let liczba1_heb = prompt("Podaj pierwszą liczbę:");
    let liczba2_heb = prompt("Podaj drugą liczbę:");

    liczba1_heb = parseInt(liczba1_heb);
    liczba2_heb = parseInt(liczba2_heb);

    if (liczba1_heb == liczba2_heb) {
        confirm("Liczby są równe");
    } else if (liczba1_heb < liczba2_heb) {
        for (let k_heb = liczba1_heb; k_heb <= liczba2_heb; k_heb++) {
            if (k_heb % 2 == 0) {
                document.write("<span style='color:green; font-size:30px;'>" + k_heb + "</span><br>");
            }
        }
    } else {
        for (let k_heb = liczba1_heb; k_heb >= liczba2_heb; k_heb--) {
            if (k_heb % 2 != 0) {
                document.write("<span style='color:blue; font-size:10px;'>" + k_heb + "</span><br>");
            }
        }
    }
</script>

</body>
</html>
