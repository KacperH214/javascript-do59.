<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 55 - Kacper Hebel</title>
</head>
<body>

<script>
    let pocz_heb;
    let tekst_heb;
    let ilosc_heb;

    do {
        pocz_heb = prompt("Podaj wielkość początkową tekstu z przedziału <20,60>:");
        pocz_heb = parseInt(pocz_heb);

        if (pocz_heb < 20 || pocz_heb > 60) {
            alert("Liczba nie należy do przedziału <20,60>");
        }
    } while (pocz_heb < 20 || pocz_heb > 60);

    tekst_heb = prompt("Podaj dowolny tekst:");
    ilosc_heb = prompt("Ile razy wyświetlić tekst?");
    ilosc_heb = parseInt(ilosc_heb);

    for (let k_heb = 1; k_heb <= ilosc_heb; k_heb++) {
        document.write(
            "<p style='font-size:" + pocz_heb + "px; color:black;'>" 
            + tekst_heb + "</p>"
        );

        if (pocz_heb < 100) {
            pocz_heb = pocz_heb + 5;
        } else {
            pocz_heb = pocz_heb - 5;
        }
    }
</script>

</body>
</html>
