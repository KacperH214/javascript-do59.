<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 43 - Kacper Hebel</title>
</head>
<body>

<script>
    let koniec_petli_heb = prompt("Podaj liczbę końcową:");
    koniec_petli_heb = parseInt(koniec_petli_heb);

    for (let k_heb = 2; k_heb <= koniec_petli_heb; k_heb++) {
        if (k_heb % 2 == 0) {
            document.write(k_heb + "<br>");
        }
    }
</script>
